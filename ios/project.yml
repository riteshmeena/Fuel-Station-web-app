name: FuelStation
options:
  bundleIdPrefix: in.fuelstation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  FuelStation:
    type: application
    platform: iOS
    sources:
      - FuelStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.fuelstation.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FuelStation/Resources/Info.plist
    info:
      path: FuelStation/Resources/Info.plist
      properties:
        CFBundleDisplayName: Fuel Station
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan customer fuel cards and reward codes at the pump.
        NSLocationWhenInUseUsageDescription: Show the distance to the fuel station.
        # Point this at your server, e.g. https://api.yourstation.in/api/v1
        API_BASE_URL: http://localhost:4000/api/v1
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
